name: Publier une version

# Se déclenche quand le numéro de version change dans core/version.py (ou à la main depuis
# l'onglet « Actions »). Si la version n'est pas encore publiée : tests, fabrication du .exe et de
# l'installateur sous Windows, puis publication dans « Releases » avec l'étiquette vX.Y.Z.
# L'application installée détecte alors la nouvelle version et la propose.
on:
  push:
    branches: [main]
    paths: ["core/version.py", "requirements.txt", "packaging/**", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Lire la version et vérifier qu'elle n'est pas déjà publiée
        id: version
        shell: pwsh
        run: |
          $version = (python -c "import sys; sys.path.insert(0, '.'); from core.version import __version__; print(__version__)").Trim()
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          gh release view "v$version" --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "La version v$version est déjà publiée : rien à faire."
            "skip=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            "skip=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }
          if (-not (Test-Path "packaging/release-notes/$version.md")) { throw "Notes de version manquantes : packaging/release-notes/$version.md" }
          $global:LASTEXITCODE = 0
      - if: steps.version.outputs.skip == 'false'
        run: python -m pip install --upgrade pip
      - if: steps.version.outputs.skip == 'false'
        run: pip install -r requirements.txt
      - name: Tests
        if: steps.version.outputs.skip == 'false'
        run: python -m pytest -q
      - name: Fabriquer l'exécutable et l'installateur
        if: steps.version.outputs.skip == 'false'
        shell: pwsh
        run: ./packaging/build_exe.ps1
      - name: Publier la version
        if: steps.version.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: "Version ${{ env.VERSION }}"
          body_path: packaging/release-notes/${{ env.VERSION }}.md
          files: |
            dist/installer/SolanaTradingDesk-Setup-${{ env.VERSION }}.exe
            dist/installer/SHA256SUMS.txt
          fail_on_unmatched_files: true
