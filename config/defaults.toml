# =============================================================================
# MY SOLANA TRADING DESK — valeurs par défaut
#
# Les sections capital, demo, judge, exit, execution, schedule et discovery peuvent être
# modifiées depuis le tableau de bord (et uniquement par lui). Les modifications
# sont enregistrées dans la base de données ; ce fichier reste la référence
# d'origine. Les agents ne reçoivent qu'une copie en lecture seule.
#
# Les sections [providers] et [tokens] sont techniques : à ne modifier que si
# un fournisseur change d'adresse.
# =============================================================================

[capital]
total_eur = 50.0              # capital total maximal
reserve_eur = 27.5            # réserve jamais investie
trading_budget_eur = 17.5     # montant maximal investi en même temps
fee_reserve_eur = 5.0         # SOL gardé pour payer les frais
max_position_eur = 2.0        # montant maximal d'un achat
max_open_positions = 2        # positions ouvertes en même temps
max_traders = 5               # wallets suivis au maximum
max_daily_loss_eur = 1.5      # au-delà : plus aucun nouvel achat ce jour-là

[demo]
start_balance_eur = 50.0      # solde virtuel du compte démo (argent fictif, marché réel)

[judge]
min_trader_score = 60.0           # score HEAD minimal (0-100)
min_trader_closed_trades = 30     # trades clôturés minimum dans l'historique
min_trader_history_days = 14      # ancienneté minimale de l'historique
max_source_age_seconds = 20       # au-delà, l'achat du trader est jugé trop ancien
min_liquidity_usd = 20000.0       # liquidité minimale du pool principal
max_top10_holders_pct = 35.0      # concentration maximale des 10 premiers détenteurs
min_token_age_minutes = 30        # âge minimal du token
max_buy_price_impact_pct = 2.0    # impact prix maximal à l'achat
max_sell_price_impact_pct = 3.0   # impact prix maximal du devis de revente
max_total_fees_pct = 3.0          # frais totaux maximum en % de la position
max_report_age_seconds = 30       # fraîcheur maximale des rapports d'agents
wait_timeout_seconds = 30         # durée maximale d'une décision WAIT

[exit]
stop_loss_pct = 25.0          # vente si perte latente >= 25 %
take_profit_pct = 50.0        # vente si gain latent >= 50 %
follow_trader_sells = true    # vendre quand le trader copié vend
max_hold_hours = 24.0         # sortie au-delà de cette durée
min_liquidity_usd = 5000.0    # sortie si la liquidité tombe sous ce seuil

[discovery]
enabled = true                    # le bot cherche lui-même les meilleurs traders (agent HUNTER)
source = "auto"                   # "auto" : GMGN si une clé est enregistrée, sinon la blockchain (sans clé) ; ou "gmgn" / "onchain"
target_traders = 5                # nombre de traders copiés en permanence
interval_minutes = 2.0            # vérification et remplacement des traders non concluants
period = "7d"                     # période des statistiques GMGN : "7d" ou "30d"
candidates_per_cycle = 6          # candidats évalués à chaque passage (limite du forfait gratuit GMGN)
stats_ttl_minutes = 60            # une évaluation reste valable 1 h
min_tokens = 10                   # tokens tradés minimum sur la période
max_trades_per_day = 150          # au-delà : robot impossible à suivre
min_avg_hold_seconds = 60         # revend trop vite pour être copié avec quelques secondes de retard
max_idle_minutes = 60             # aucun trade depuis 60 min : non concluant
max_copied_loss_eur = 1.0         # nos copies de ce trader ont perdu 1 € : non concluant
swap_margin = 10.0                # un candidat remplace le plus faible s'il a 10 points de plus
cooldown_hours = 6.0              # un trader écarté n'est pas repris avant 6 h
# --- recherche sur la blockchain (aucune clé) : tokens actifs de Jupiter -> acheteurs -> historique noté par HEAD
scan_minutes = 15                 # nouvelle liste d'acheteurs toutes les 15 min
onchain_category = "toporganicscore"  # tokens Jupiter : "toporganicscore", "toptraded" ou "toptrending"
onchain_interval = "1h"           # "5m", "1h", "6h" ou "24h"
onchain_tokens = 4                # tokens examinés par recherche
onchain_pool_sample = 30          # dernières transactions lues par token
min_buy_sol = 0.2                 # achats plus petits ignorés (bruit, robots)
onchain_evals_per_cycle = 1       # historiques complets notés par passage (≈ 300 transactions chacun)

[execution]
venue = "jupiter"                     # exécution : Jupiter, signée localement par le compte Phantom dédié au bot
slippage_bps = 150                    # tolérance de slippage (1,5 %)
max_priority_fee_lamports = 200000    # plafond de frais de priorité (0,0002 SOL)
confirmation_timeout_seconds = 60

[schedule]
enabled = true
start = "08:00"               # ouverture des nouvelles entrées
stop = "23:00"                # fermeture des nouvelles entrées (les sorties continuent)
days = ["mon", "tue", "wed", "thu", "fri", "sat", "sun"]
timezone = "Europe/Paris"

[providers.helius]
rpc_url = "https://mainnet.helius-rpc.com/?api-key={key}"
ws_url = "wss://mainnet.helius-rpc.com/?api-key={key}"
requests_per_second = 8.0         # offre gratuite : 10/s, on garde une marge
monthly_credit_budget = 900000    # offre gratuite : 1 000 000 crédits/mois
max_transaction_version = 0

[providers.public_rpc]
# RPC public de la Fondation Solana : gratuit, sans clé, limité (100 requêtes / 10 s par IP, 40 par méthode).
# Utilisé par HUNTER, et pour tout le bot si aucune clé Helius n'est enregistrée.
rpc_url = "https://api.mainnet.solana.com"
ws_url = "wss://api.mainnet.solana.com"
requests_per_second = 3.0

[providers.jupiter]
base_url = "https://api.jup.ag"
requests_per_second = 0.9         # clé gratuite : 1/s
requests_per_second_keyless = 0.45

[providers.dexscreener]
base_url = "https://api.dexscreener.com"
requests_per_second = 4.0         # limite publique : 300/min

[providers.rugcheck]
base_url = "https://api.rugcheck.xyz"
requests_per_second = 1.0

[agents]
head_max_transactions = 300        # transactions analysées par trader (1 crédit Helius chacune)
head_cache_hours = 6.0             # durée de validité d'une évaluation HEAD
whale_sample_size = 25             # transactions récentes du pool examinées par WHALE
whale_big_trade_pct_liquidity = 1.0  # une transaction >= 1 % de la liquidité est « grosse »
whale_group_window_minutes = 30    # fenêtre pour repérer des achats groupés des traders suivis
sniper_min_position_eur = 0.5      # en dessous, les frais mangent tout : pas de proposition
sniper_min_edge_ratio = 2.0        # le gain moyen du trader doit valoir au moins 2x le coût aller-retour
exit_trend_drop_m5_pct = 15.0      # chute de 15 % en 5 min sous le prix d'entrée = retournement
agent_timeout_seconds = 20.0       # un agent qui dépasse ce délai est considéré indisponible

[venues.gmgn]
base_url = "https://openapi.gmgn.ai"
fee_pct = 1.0                         # frais GMGN par achat ou vente

[venues.jupiter]
fee_pct_estimate = 0.1                # indicatif : le frais exact est lu dans chaque devis

[updates]
repository = "apkiiii/solana-trading-desk"   # dépôt GitHub public qui publie les versions
check_interval_hours = 6.0
installer_prefix = "SolanaTradingDesk-Setup-"

